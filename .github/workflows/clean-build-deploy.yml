name: Deploy Clean Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Weekly build at 03:00 UTC every Monday
    - cron: '0 3 * * 1'

jobs:
  clean-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint and format check
        run: |
          uvx ruff@0.15.10 check .
          uvx ruff@0.15.10 format --check .

      - name: Install dependencies
        run: uv sync
    
      - name: Clean and build site
        run: uv run site-utils.py -o docs clean build

      - name: Set timestamp variable
        id: vars
        run: echo "timestamp=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout deploy branch
        run: |
          git fetch origin
          git checkout -B deploy

      - name: Commit and push to deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Generated pages are ignored on main, so add them explicitly
          git add -f docs
          git commit -m "Deploy build: ${{ env.timestamp }}" || echo "No changes to commit"
          git push origin deploy --force
