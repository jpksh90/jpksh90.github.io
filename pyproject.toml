[project]
name = "personal-website"
version = "1.0.0"
description = "Static site generator for personal website"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "jinja2>=3.1.0",
    "mistune>=3.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pylint>=2.17.0",
    "black>=23.0.0",
]

[tool.black]
line-length = 79
target-version = ['py38']

[tool.pylint.messages_control]
max-line-length = 79

[tool.uv]
# This is a script, not an installable package; skip building it (no egg-info).
package = false
