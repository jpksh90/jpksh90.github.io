[project]
name = "personal-website"
version = "1.0.0"
description = "Static site generator for personal website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.0",
    "mistune>=3.2.0",
    "pillow>=12.0",
    "pyyaml>=6.0",
]

# `uv run sitegen ...` runs the site generator (see README.md).
[project.scripts]
sitegen = "sitegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitegen"]

# Lint and format with `uvx ruff@0.15.10 check` / `uvx ruff@0.15.10 format`;
# CI runs both with this exact version.
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
